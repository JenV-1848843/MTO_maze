<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c10;
      --panel: #0d1520;
      --border: #1a3a5c;
      --accent: #00ffe0;
      --accent-dim: #00ffe033;
      --danger: #ff3b5c;
      --danger-dim: #ff3b5c22;
      --text: #c8ddf0;
      --muted: #3a6080;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 999;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(0,255,224,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,224,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 48px 56px;
      width: min(720px, 95vw); 
      
      /* Always show scrollbar to prevent layout width jumps */
      max-height: 85vh;
      overflow-y: scroll; 
      
      position: relative;
      box-shadow: 0 0 0 1px #0a1e33, 0 0 60px rgba(0,255,224,0.04), inset 0 1px 0 rgba(0,255,224,0.06);
    }

    /* Custom Scrollbar */
    .panel::-webkit-scrollbar { width: 8px; }
    .panel::-webkit-scrollbar-track { background: transparent; margin: 4px 0; }
    .panel::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }
    .panel::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .panel::before, .panel::after {
      content: ''; position: absolute; width: 14px; height: 14px; border-color: var(--accent); border-style: solid;
    }
    .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .corner-tr, .corner-bl {
      position: absolute; width: 14px; height: 14px; border-color: var(--accent); border-style: solid;
    }
    .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

    .tag { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }
    .tag::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    h1 { font-family: var(--font-ui); font-weight: 600; font-size: clamp(22px, 5vw, 30px); letter-spacing: 0.12em; text-transform: uppercase; color: #e8f4ff; margin-bottom: 8px; }
    .subtitle { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 24px; letter-spacing: 0.05em; }

    .tabs { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: transparent; border: none; color: var(--muted); font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.1em; cursor: pointer; text-transform: uppercase; padding: 4px 8px; transition: color 0.2s, text-shadow 0.2s; position: relative; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); text-shadow: 0 0 8px var(--accent-dim); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -9px; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    .view-content { display: none; min-height: 120px; margin-bottom: 24px; }
    .view-content.active { display: block; }
    .placeholder-text { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; height: 100%; opacity: 0.7; }

    .target-area { width: 100%; height: 300px; border: 1px dashed var(--muted); background: rgba(0, 0, 0, 0.3); position: relative; cursor: crosshair; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; }
    .target-area::before, .target-area::after { content: ''; position: absolute; background: rgba(58, 96, 128, 0.3); }
    .target-area::before { width: 100%; height: 1px; top: 50%; }
    .target-area::after { height: 100%; width: 1px; left: 50%; }

    details.pid-settings { background: #060a0f; border: 1px solid var(--border); padding: 16px; border-radius: 2px; }
    details.pid-settings summary { font-family: var(--font-mono); font-size: 14px; color: var(--accent); cursor: pointer; letter-spacing: 0.1em; outline: none; }
    .pid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--muted); }
    .pid-col h3 { font-family: var(--font-ui); font-size: 16px; color: var(--text); letter-spacing: 0.1em; margin-bottom: 12px; text-transform: uppercase; }
    .pid-field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .pid-field input { background: #080c10; border: 1px solid var(--border); color: var(--accent); font-family: var(--font-mono); padding: 6px 8px; width: 80px; outline: none; text-align: right; }
    .pid-field input:focus { border-color: var(--accent); }
    
    .btn-update { width: 100%; margin-top: 24px; padding: 12px 0; font-size: 13px; }

    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .status-dot.running { background: var(--accent); box-shadow: 0 0 10px var(--accent); } /* Animation removed */
    .status-dot.stopped { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    
    /* Fixed width prevents horizontal shifting when text changes */
    #status-text { color: var(--text); display: inline-block; min-width: 65px; } 

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Simplified Button CSS */
    .btn { font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; border: none; border-radius: 2px; padding: 18px 0; cursor: pointer; transition: background-color 0.2s, opacity 0.2s; }
    .btn:active { filter: brightness(0.8); } /* Safer active state than scaling */
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-start { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-start:hover:not(:disabled) { background: var(--accent-dim); }

    .btn-stop { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-stop:hover:not(:disabled) { background: var(--danger-dim); }

    .log-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    .log { background: #060a0f; border: 1px solid var(--border); border-radius: 2px; padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); height: 80px; overflow-y: scroll; display: flex; flex-direction: column; gap: 4px; } /* Always show log scrollbar */
    .log-entry.ok  { color: var(--accent); }
    .log-entry.err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="panel">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="tag">SYS · CTRL · v1.3</div>
    <h1>Control Panel</h1>
    <p class="subtitle">raspberry-pi · local endpoint</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('CONTROLLER')">CONTROLLER</button>
      <button class="tab-btn" onclick="switchTab('AUTO')">AUTO</button>
      <button class="tab-btn" onclick="switchTab('MANUAL')">MANUAL</button>
      <button class="tab-btn" onclick="switchTab('CALIB')">CALIB</button>
    </div>

    <div id="view-CONTROLLER" class="view-content active">
      <div class="target-area" id="target-area">
        <span class="placeholder-text">[ Awaiting coordinate selection logic ]</span>
      </div>

      <details class="pid-settings">
        <summary>▶ PID TUNING PARAMETERS</summary>
        <div class="pid-grid">
          <div class="pid-col">
            <h3>PID - X</h3>
            <div class="pid-field"><label>Kp</label><input type="number" id="kpx" step="0.01" value="0.00"></div>
            <div class="pid-field"><label>Ki</label><input type="number" id="kix" step="0.01" value="0.00"></div>
            <div class="pid-field"><label>Kd</label><input type="number" id="kdx" step="0.01" value="0.00"></div>
          </div>
          <div class="pid-col">
            <h3>PID - Y</h3>
            <div class="pid-field"><label>Kp</label><input type="number" id="kpy" step="0.01" value="0.00"></div>
            <div class="pid-field"><label>Ki</label><input type="number" id="kiy" step="0.01" value="0.00"></div>
            <div class="pid-field"><label>Kd</label><input type="number" id="kdy" step="0.01" value="0.00"></div>
          </div>
        </div>
        <button class="btn btn-start btn-update" onclick="updatePID()">⟳ Update Parameters</button>
      </details>
    </div>

    <div id="view-AUTO" class="view-content">
      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">STOPPED</span>
      </div>

      <div class="controls">
        <button class="btn btn-start" id="btn-start" onclick="sendCommand('start')">▶ Start</button>
        <button class="btn btn-stop"  id="btn-stop"  onclick="sendCommand('stop')" disabled>■ Stop</button>
      </div>
    </div>

    <div id="view-MANUAL" class="view-content">
      <div class="placeholder-text">> Manual override interface offline. Connect joystick...</div>
    </div>

    <div id="view-CALIB" class="view-content">
      <div class="placeholder-text">> Calibration routine offline. Prepare for IMU leveling...</div>
    </div>

    <div class="log-label">// event log</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const log = document.getElementById('log');
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');

    function addLog(msg, type = '') {
      const now = new Date().toTimeString().slice(0,8);
      const el = document.createElement('div');
      el.className = 'log-entry' + (type ? ' ' + type : '');
      el.textContent = `[${now}] ${msg}`;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function setRunning(running) {
      dot.className = 'status-dot ' + (running ? 'running' : 'stopped');
      statusText.textContent = running ? 'RUNNING' : 'STOPPED';
      btnStart.disabled = running;
      btnStop.disabled  = !running;
    }

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText === mode) btn.classList.add('active');
      });

      document.querySelectorAll('.view-content').forEach(view => {
        view.classList.remove('active');
      });
      document.getElementById(`view-${mode}`).classList.add('active');

      setMode(mode);
    }

    async function setMode(mode) {
      addLog(`Requesting mode change: ${mode}...`);
      try {
        const res = await fetch(`http://${location.hostname}:8080/api/mode?set=${mode}`, { method: 'POST' });
        const text = await res.text();
        if (res.ok) { addLog(`Mode set to ${mode}`, 'ok'); } 
        else { addLog(`Error ${res.status}: ${text}`, 'err'); }
      } catch (e) { addLog(`Network failed: ${e.message}`, 'err'); }
    }

    async function updatePID() {
      const kpx = document.getElementById('kpx').value;
      const kix = document.getElementById('kix').value;
      const kdx = document.getElementById('kdx').value;
      const kpy = document.getElementById('kpy').value;
      const kiy = document.getElementById('kiy').value;
      const kdy = document.getElementById('kdy').value;

      const queryParams = new URLSearchParams({ kpx, kix, kdx, kpy, kiy, kdy }).toString();

      addLog('Pushing PID parameters to hardware...');
      try {
        const res = await fetch(`http://${location.hostname}:8080/api/pid?${queryParams}`, { method: 'POST' });
        const text = await res.text();
        if (res.ok) { addLog('PID settings updated successfully.', 'ok'); } 
        else { addLog(`Error ${res.status}: ${text}`, 'err'); }
      } catch (e) { addLog(`Failed to push PID data: ${e.message}`, 'err'); }
    }

    async function sendCommand(cmd) {
      addLog(`Sending command: ${cmd.toUpperCase()}…`);
      try {
        const res = await fetch(`http://${location.hostname}:8080/command?action=${cmd}`);
        const text = await res.text();
        if (res.ok) {
          addLog(`Response: ${text}`, 'ok');
          setRunning(cmd === 'start');
        } else { addLog(`Error ${res.status}: ${text}`, 'err'); }
      } catch (e) { addLog(`Request failed: ${e.message}`, 'err'); }
    }

    addLog('Interface ready. System standing by.');
  </script>
</body>
</html>
